# Cloudflare Pages 設定（ad-report-cloudflare）
# - 本機：npm run dev:pages（wrangler pages dev，含 D1 / R2 本機模擬）
# - 部署：GitHub Actions 跑 `wrangler pages deploy dist`，會依此檔套用 binding。
#   注意：有了這個檔之後，Pages 後台「Bindings / 環境變數」改由此檔管理；
#   Secret（加密變數）仍在後台或用 `wrangler pages secret put <NAME>` 設定：
#     ACCESS_AUD               Cloudflare Access 應用程式的 AUD tag（Zero Trust → Access → Applications → 該 app → Overview）
#     API_TOKEN                給 MCP / LINE bot 等程式呼叫 /api 用的 Bearer token（自己產一組長亂數）
#     OPENAI_API_KEY           解析 MD 排程用（原本就有）
#     LINE_CHANNEL_ACCESS_TOKEN 推 LINE 用（原本就有）
name = "ad-report-cloudflare"
pages_build_output_dir = "dist"
compatibility_date = "2025-03-25"
compatibility_flags = ["nodejs_compat"]

# ACCESS_TEAM_DOMAIN（lingering-cherry-4e64.cloudflareaccess.com）與 ACCESS_AUD 都用
# `wrangler pages secret put` 設在 Pages 專案上；同名不能同時出現在 [vars]，否則部署會報
# "Binding name already in use"。

[[d1_databases]]
binding = "DB"
database_name = "adreport"
database_id = "04dbb20a-0f0d-4dcf-9887-a85797841e38"
migrations_dir = "migrations/d1"

# agent_* 四張表（員工／任務／客戶訊息）的唯一真身是 LINE bot 的 D1 `mommy-wisdom-bot`；
# functions/_lib/agent.js 用 env.AGENT_DB || env.DB，有這個 binding 就讀 bot 那顆。
# 本機 wrangler pages dev 這顆是空的（bot 的本機資料在 ~/mommy-wisdom-worker/.wrangler），智慧媽咪頁會顯示空白，正常。
[[d1_databases]]
binding = "AGENT_DB"
database_name = "mommy-wisdom-bot"
database_id = "96da29bb-83e6-47b0-851e-cb36b5356734"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "adreport-ads"
