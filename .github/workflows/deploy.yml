name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {} # 改了 Pages secret 之後要重新部署才會生效，可在 GitHub Actions 頁面手動按

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # 2026-11 起前端不再直連 Supabase，build 不需要任何 VITE_* 變數；
      # D1 / R2 binding 由 wrangler.toml 在 pages deploy 時套用。
      - run: npm run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ad-report-cloudflare
